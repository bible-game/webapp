name: release
on:
  workflow_call:
jobs:
  release:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
      - name: Set-up User 🐵
        uses: fregante/setup-git-user@v2
      - name: Release Version and Tag 🏷️
        run: |
          VERSION="$(jq -r '.version' package.json | cut -d "-" -f 1)"
          npm version "$VERSION" --no-git-tag-version
          git commit -am "[release] webapp-$VERSION"
          git tag "$VERSION" -m "[release] webapp-$VERSION"
          git push origin HEAD "$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        # Note :: -SNAPSHOT is only stripped here; the next one is added to develop by step-bump
      - name: Release 📦
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
