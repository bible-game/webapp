# Weekly dependency updates, raised against develop so they ship with the next release
# Note :: security updates always target the default branch, whatever target-branch says
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "[deps]"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [ minor, patch ]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "[deps]"
    groups:
      actions:
        patterns: [ "*" ]
